<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bioferia · Texturas de Impacto</title>
  <style>
    body { margin: 0; padding: 16px; background: #2b2b2b; display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start; }
    canvas { max-width: 420px; height: auto; display: block; }
  </style>
</head>
<body>
<script>
/* =========================================================================
   Texturas para Impacto (app): más grotescas y grunge, en la línea de la señalética.
   - tornasol: placa metálica iridiscente, limpia (para títulos y cards)
   - placa: tornasol con bordes de trama negra, azul eléctrico y amarillo
   - grunge: fondo negro con nubes de trama azul, manchas amarillas, grano y rayas
   exportAll() guarda los PNG en exports/ (con server.js).
   ========================================================================= */
const BLUE = [36, 64, 255], YELLOW = [238, 255, 26], BLACK = [8, 6, 16];
const rnd = (() => { let s = 7; return () => { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; }; })();
const hash = (x, y) => { const v = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return v - Math.floor(v); };
function vnoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi, u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash(xi, yi), b = hash(xi + 1, yi), c = hash(xi, yi + 1), d = hash(xi + 1, yi + 1);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
const fbm = (x, y) => vnoise(x, y) * 0.55 + vnoise(x * 2.1, y * 2.1) * 0.3 + vnoise(x * 4.3, y * 4.3) * 0.15;

// tornasol: gradiente iridiscente con bandas metálicas
function holoPixels(ctx, w, h, seed = 0) {
  const STOPS = [[246, 198, 240], [214, 196, 255], [250, 250, 255], [196, 244, 255], [255, 246, 200], [246, 198, 240]];
  const img = ctx.createImageData(w, h), d = img.data;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const n = fbm(x / w * 3 + seed, y / h * 3);
    let t = (x / w * 0.7 + y / h * 0.5 + n * 0.9 + 0.12 * Math.sin((x + y * 0.6) / w * 18 + n * 6)) % 1; if (t < 0) t += 1;
    const k = t * (STOPS.length - 1), i = Math.floor(k), f = k - i, A = STOPS[i], B = STOPS[i + 1];
    const sheen = 0.9 + 0.1 * Math.sin((x * 0.8 - y) / w * 30 + n * 10);
    const g = (rnd() - 0.5) * 14, p = (y * w + x) * 4;
    for (let c = 0; c < 3; c++) d[p + c] = Math.max(0, Math.min(255, (A[c] + (B[c] - A[c]) * f) * sheen + g));
    d[p + 3] = 255;
  }
  ctx.putImageData(img, 0, 0);
}
// trama de puntos: el radio sigue a field(x, y) 0..1
function halftone(ctx, w, h, cell, color, field, angle = 0.4) {
  ctx.fillStyle = `rgb(${color})`;
  const ca = Math.cos(angle), sa = Math.sin(angle), R = Math.hypot(w, h);
  for (let gy = -R; gy < R; gy += cell) for (let gx = -R; gx < R; gx += cell) {
    const x = w / 2 + gx * ca - gy * sa, y = h / 2 + gx * sa + gy * ca;
    if (x < -cell || y < -cell || x > w + cell || y > h + cell) continue;
    const v = field(x, y); if (v <= 0.02) continue;
    ctx.beginPath(); ctx.arc(x, y, Math.min(1, v) * cell * 0.62, 0, Math.PI * 2); ctx.fill();
  }
}
function grain(ctx, w, h, amt) {
  const img = ctx.getImageData(0, 0, w, h), d = img.data;
  for (let i = 0; i < d.length; i += 4) { const g = (rnd() - 0.5) * amt; d[i] += g; d[i + 1] += g; d[i + 2] += g; }
  ctx.putImageData(img, 0, 0);
}
function make(w, h, name, draw) {
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h; cv.dataset.name = name;
  draw(cv.getContext('2d'), w, h); document.body.appendChild(cv); return cv;
}

// 1 · tornasol limpio
make(1200, 800, 'impacto-tornasol', (c, w, h) => { holoPixels(c, w, h, 1.3); grain(c, w, h, 10); });

// 2 · placa: tornasol con bordes de trama (como la señalética)
make(1200, 800, 'impacto-placa', (c, w, h) => {
  holoPixels(c, w, h, 4.1);
  const edge = (x, y) => { const e = Math.min(x / w, 1 - x / w, y / h, 1 - y / h); return e; };
  // amarillo y azul en franjas onduladas por los bordes, negro encima
  halftone(c, w, h, 22, YELLOW, (x, y) => { const e = edge(x, y), n = fbm(x / 140, y / 140); return (0.2 - e) * 6 * (0.6 + n) * (y / h < 0.5 ? 1 : 0.5); });
  halftone(c, w, h, 22, BLUE, (x, y) => { const e = edge(x, y), n = fbm(x / 120 + 9, y / 120); return (0.18 - e) * 6 * (0.5 + n) * (y / h > 0.4 ? 1 : 0.4); }, 0.9);
  halftone(c, w, h, 14, BLACK, (x, y) => { const e = edge(x, y), n = fbm(x / 90 + 3, y / 90 + 3); return (0.09 - e) * 12 * (0.4 + n); }, 0.2);
  grain(c, w, h, 12);
});

// 3 · grunge oscuro (fondo de pantalla)
make(1179, 2556, 'impacto-grunge', (c, w, h) => {
  c.fillStyle = `rgb(${BLACK})`; c.fillRect(0, 0, w, h);
  // nubes de azul eléctrico en trama
  halftone(c, w, h, 18, BLUE, (x, y) => { const n = fbm(x / 420, y / 420); return (n - 0.42) * 2.6; });
  // brillo azul suave por debajo de la trama
  c.globalCompositeOperation = 'screen';
  for (let i = 0; i < 6; i++) { const x = rnd() * w, y = rnd() * h, r = 300 + rnd() * 500; const g = c.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, 'rgba(36,64,255,0.35)'); g.addColorStop(1, 'rgba(36,64,255,0)'); c.fillStyle = g; c.fillRect(0, 0, w, h); }
  c.globalCompositeOperation = 'source-over';
  // manchas amarillas chicas
  halftone(c, w, h, 12, YELLOW, (x, y) => { const n = fbm(x / 160 + 20, y / 160 + 20); return (n - 0.68) * 5; }, 1.1);
  // rayas y polvo
  c.strokeStyle = 'rgba(255,255,255,0.08)';
  for (let i = 0; i < 90; i++) { c.lineWidth = rnd() * 1.6; const x = rnd() * w, y = rnd() * h, l = 40 + rnd() * 260, a = -0.3 + rnd() * 0.6;
    c.beginPath(); c.moveTo(x, y); c.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l); c.stroke(); }
  for (let i = 0; i < 1800; i++) { c.fillStyle = `rgba(255,255,255,${rnd() * 0.12})`; c.fillRect(rnd() * w, rnd() * h, 1 + rnd() * 2, 1 + rnd() * 2); }
  grain(c, w, h, 26);
});

async function exportAll() {
  for (const cv of document.querySelectorAll('canvas')) {
    const blob = await new Promise((r) => cv.toBlob(r, 'image/png'));
    await fetch('/export?name=' + cv.dataset.name + '.png', { method: 'POST', body: blob });
  }
  return document.querySelectorAll('canvas').length;
}
</script>
</body>
</html>
