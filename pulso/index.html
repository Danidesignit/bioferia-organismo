<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Bioferia · Pulso</title>
  <style>
    :root { --bg: #F4F3EE; --ink: #1A1033; --muted: rgba(26,16,51,.55); }
    body { margin: 0; min-height: 100svh; display: grid; place-items: center; text-align: center; padding: 24px 16px;
      background: var(--bg); color: var(--ink); font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    h1 { font-size: 26px; letter-spacing: -.02em; margin: 0 0 8px; font-weight: 600; }
    p { color: var(--muted); margin: 0 0 28px; line-height: 1.45; }
    button { font: inherit; font-weight: 600; padding: 14px 26px; border-radius: 99px; border: 0; background: #7B3FF2; color: #fff; }
    #ok { margin-top: 16px; min-height: 1.4em; color: #00A859; }
  </style>
</head>
<body>
  <main>
    <h1>Todo comienza con un pulso</h1>
    <p>La interfaz táctil llega en la etapa 2.<br>Por ahora podés enviar un pulso de prueba<br>a la pantalla colectiva abierta en otra pestaña.</p>
    <button id="send">Sumar al colectivo</button>
    <div id="ok"></div>
  </main>
  <script src="../shared/config.js"></script>
  <script src="../shared/utils.js"></script>
  <script src="../shared/pulse.js"></script>
  <script src="../shared/bus.js"></script>
  <script>
    document.getElementById('send').onclick = async () => {
      await PulseBus.send(Pulse.simulate());
      const ok = document.getElementById('ok');
      ok.textContent = 'Tu pulso ya es parte del colectivo';
      setTimeout(() => (ok.textContent = ''), 2500);
    };
  </script>
</body>
</html>
