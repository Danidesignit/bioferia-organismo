<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bioferia · Impacto</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Instrument+Sans:wght@500..600&display=swap">
  <style>
    html, body { margin: 0; height: 100%; background: #2b2b2b; overflow: hidden; }
    main { height: 100%; display: grid; place-items: center; }
    main canvas { max-width: 100vw; max-height: 100vh; width: auto !important; height: auto !important; }
  </style>
</head>
<body>
<main id="stage"></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
<script>
/* =========================================================================
   IMPACTO v2 · "lo que se transforma"   (16:9 · loop de 12 s)
   Misma familia (calor + estela + trama + isolíneas + grano) + una capa de
   TINTA NEGRA: letras y huella negras con el halo térmico alrededor.
     0–1.4 s   calma: una sombra baja hacia el piso.
     1.4 s     el golpe: la suela pisa en negro, la pantalla parpadea a negro y glitch.
     1.5–3.8 s la onda expansiva: letras negras disparadas radialmente, rayos y anillos.
     4–9 s     lo que cambió: IMPACTO con contorno negro, "El cambio" y el logo en negro.
     9–12 s    todo se quema en trama y vuelve al blanco (loop exacto).
   Buffer: canal R = calor (color térmico) · canal G = tinta negra.
   window.T = segundos fija un instante · exportMP4() guarda el video (con server.js).
   ========================================================================= */
const LOOP = 12, T0 = 1.4;                 // T0 = el golpe
const CW = 1920, CH = 1080;
const Q = 0.5;

// mapa térmico de Impacto: blanco → lilas → azul → violeta → verde → amarillo flúor
const RAMP = [
  [0.00, '#ffffff'], [0.07, '#f3eefc'], [0.18, '#d7c2f5'], [0.3, '#9d86f0'], [0.42, '#3f43e6'],
  [0.54, '#2228b8'], [0.63, '#7a3fe0'], [0.7, '#22a85a'], [0.76, '#e6ff00'], [0.88, '#f2ff3a'], [1.0, '#fbffc4'],
];

const VERT = `
precision highp float;
attribute vec3 aPosition; attribute vec2 aTexCoord;
uniform mat4 uModelViewMatrix, uProjectionMatrix;
varying vec2 vUv;
void main(){ vUv = aTexCoord; gl_Position = uProjectionMatrix * uModelViewMatrix * vec4(aPosition, 1.0); }`;

const FRAG = `
precision highp float;
varying vec2 vUv;
uniform sampler2D uHeat, uRamp, uInk;
uniform vec2 uRes;
uniform float uTime, uCell, uGlitch, uFlash, uRip, uRipT;
float hash(vec2 p){ p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
float vnoise(vec2 p){ vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash(i), hash(i + vec2(1.0, 0.0)), f.x), mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), f.x), f.y); }
vec3 ramp(float h){ return texture2D(uRamp, vec2(clamp(h, 0.0, 1.0), 0.5)).rgb; }
float heatAt(vec2 uv){ return 1.0 - exp(-max(texture2D(uHeat, uv).r - 0.03, 0.0) * 1.8); }
float inkAt(vec2 uv){ return texture2D(uInk, uv).r; }
void main(){
  vec2 uv = vUv;
  // la onda del golpe deforma toda la imagen
  float asp = uRes.x / uRes.y;
  vec2 dd = (uv - vec2(0.5, 0.52)) * vec2(asp, 1.0);
  float rr = length(dd) + 1e-4;
  uv -= (dd / rr) / vec2(asp, 1.0) * sin(rr * 40.0 - uRipT * 11.0) * exp(-rr * 1.3) * uRip * 0.018;
  float fr = floor(uTime * 24.0), row = floor(uv.y * 60.0);
  uv.x += uGlitch * (hash(vec2(row, fr)) - 0.5) * 0.08 * step(0.75, hash(vec2(row * 1.7, fr + 3.0)));
  vec2 uvInk = uv;
  vec2 wp = uv * vec2(6.0, 3.4);
  uv += (vec2(vnoise(wp + uTime * 0.35), vnoise(wp + 7.3 - uTime * 0.3)) - 0.5) * 0.012;

  float h = heatAt(uv);
  float g = hash(gl_FragCoord.xy + fract(uTime) * 91.0) - 0.5;
  // trama de puntos (calor y tinta que se apagan)
  float a = 0.4, ca = cos(a), sa = sin(a);
  vec2 px = uv * uRes;
  vec2 r = vec2(ca * px.x - sa * px.y, sa * px.x + ca * px.y);
  vec2 cell = (floor(r / uCell) + 0.5) * uCell, f = fract(r / uCell) - 0.5;
  vec2 cp = vec2(ca * cell.x + sa * cell.y, -sa * cell.x + ca * cell.y);
  float hc = heatAt(cp / uRes);
  float rad = sqrt(hc) * 0.7;
  float dotM = smoothstep(rad, rad - 0.12, length(f));
  float dots = smoothstep(0.34, 0.1, h) * step(0.015, hc);
  vec3 col = mix(ramp(h + g * 0.05), mix(ramp(0.0), ramp(clamp(0.22 + hc * 1.4, 0.0, 1.0)), dotM), dots);
  // isolíneas amarillas / lila
  float b = h * 7.0, fb = fract(b), d2 = min(fb, 1.0 - fb);
  float line = (1.0 - smoothstep(0.01, 0.045, d2)) * smoothstep(0.3, 0.45, h);
  col = mix(col, mod(floor(b + 0.5), 2.0) < 1.0 ? vec3(0.92, 1.0, 0.0) : vec3(0.85, 0.6, 1.0), line * 0.6);

  // tinta negra: sólida donde es fuerte, en trama donde se apaga (tosco)
  vec3 BLACK = vec3(0.03, 0.02, 0.07);
  float ink = inkAt(uvInk);
  col = mix(col, BLACK, smoothstep(0.08, 0.6, ink));      // negro limpio, con borde suave

  // parpadeo a negro en el golpe (el calor queda encendido)
  col = mix(col, mix(BLACK, ramp(min(1.0, h * 1.4 + 0.2)), smoothstep(0.08, 0.5, h)), uFlash);
  col += g * 0.05 * smoothstep(0.0, 0.05, h + dots * hc + ink);
  gl_FragColor = vec4(col, 1.0);
}`;

let sh, heat, hctx, inkG, ictx, rampG, logoPaths = null, logoVB = null, lastT = null;

function setup() {
  pixelDensity(1);
  createCanvas(CW, CH, WEBGL).parent('stage');
  document.fonts.load('800 100px "Bricolage Grotesque"');
  document.fonts.load('600 40px "Instrument Sans"');
  sh = createShader(VERT, FRAG);
  heat = createGraphics(Math.round(CW * Q), Math.round(CH * Q)); heat.pixelDensity(1);
  hctx = heat.drawingContext;
  hctx.fillStyle = '#000'; hctx.fillRect(0, 0, heat.width, heat.height);
  inkG = createGraphics(CW, CH); inkG.pixelDensity(1); ictx = inkG.drawingContext;
  rampG = createGraphics(256, 1); rampG.pixelDensity(1);
  const rc = rampG.drawingContext, gr = rc.createLinearGradient(0, 0, 256, 0);
  RAMP.forEach(([p, c]) => gr.addColorStop(p, c));
  rc.fillStyle = gr; rc.fillRect(0, 0, 256, 1);
  fetch('../../assets/bioferia-logo.svg').then((r) => r.text()).then((svg) => {
    const doc = new DOMParser().parseFromString(svg, 'image/svg+xml');
    logoVB = doc.documentElement.getAttribute('viewBox').split(/\s+/).map(Number);
    logoPaths = [...doc.querySelectorAll('path')].map((p) => new Path2D(p.getAttribute('d')));
  }).catch(() => {});
}

const TAU = Math.PI * 2;
const sm = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
const mod = (a, n) => ((a % n) + n) % n;
const gauss = (x, c, w) => { const q = (x - c) / w; return Math.exp(-q * q); };
const rnd = (n) => { const v = Math.sin(n * 12.9898) * 43758.5453; return v - Math.floor(v); };
// color del buffer: calor (R) y tinta (G)
const HI = (heat) => `rgb(${Math.round(255 * Math.min(1, Math.max(0, heat)))},0,0)`;
const INK = (v) => `rgb(${Math.round(255 * Math.min(1, Math.max(0, v)))},0,0)`;

/* ---------- la huella: suela simple ---------- */
// una sola silueta continua de suela: puntera ancha, cintura angosta, talón redondeado
const SOLE = [
  [0.02, -0.56], [0.12, -0.53], [0.18, -0.44], [0.2, -0.3], [0.17, -0.16], [0.13, -0.04],
  [0.12, 0.1], [0.14, 0.24], [0.14, 0.38], [0.09, 0.5], [0.0, 0.53], [-0.09, 0.5], [-0.13, 0.38],
  [-0.12, 0.24], [-0.1, 0.1], [-0.11, -0.04], [-0.15, -0.18], [-0.17, -0.32], [-0.14, -0.46], [-0.07, -0.54],
];
function solePath(c, s) {
  const P = SOLE.map(([x, y]) => [x * s, y * s]), n = P.length;
  c.beginPath();
  c.moveTo((P[n - 1][0] + P[0][0]) / 2, (P[n - 1][1] + P[0][1]) / 2);
  for (let i = 0; i < n; i++) {
    const a = P[i], b = P[(i + 1) % n];
    c.quadraticCurveTo(a[0], a[1], (a[0] + b[0]) / 2, (a[1] + b[1]) / 2);
  }
  c.closePath();
}

/* ---------- texto con halo térmico + relleno de tinta ---------- */
function burnText(c, txt, x, y, font, heatV, inkV, S, blur = 0.04) {
  c.font = font; c.textAlign = 'center'; c.textBaseline = 'middle';
  c.filter = `blur(${S * blur}px)`;                       // halo quemado (deja estela)
  c.fillStyle = HI(heatV); c.fillText(txt, x, y);
  const k = ictx; k.save(); k.setTransform(new DOMMatrix().scale(1 / Q).multiply(c.getTransform()));
  k.font = font; k.textAlign = 'center'; k.textBaseline = 'middle';
  k.filter = `blur(${S * 0.0015}px)`;                     // relleno negro, nítido
  k.fillStyle = INK(inkV); k.fillText(txt, x, y);
  k.restore();
}

// sombra negra suave y desplazada (solo asoma por fuera de la forma)
function inkShadow(draw, dx, dy, blur, v) {
  const k = ictx;
  k.save(); k.filter = `blur(${blur}px)`; k.translate(dx, dy); k.fillStyle = INK(v); draw(k); k.restore();
  k.save(); k.globalCompositeOperation = 'destination-out'; k.filter = 'none'; k.fillStyle = '#fff'; draw(k); k.restore();
}

/* ---------- un cuadro ---------- */
const CHARS = 'IMPACTOCAMBIAHUELLAMUEVETRANSFORMA';
function heatFrame(t) {
  const W = heat.width, H = heat.height, S = H, c = hctx;
  const cx = W * 0.5, cy = H * 0.52, age = t - T0;
  c.setTransform(1, 0, 0, 1, 0, 0);
  c.globalCompositeOperation = 'source-over'; c.filter = 'none';
  c.fillStyle = 'rgba(0,0,0,0.13)'; c.fillRect(0, 0, W, H);
  c.globalCompositeOperation = 'lighter';
  c.lineCap = 'round'; c.lineJoin = 'round';
  const k0 = ictx; k0.setTransform(1, 0, 0, 1, 0, 0); k0.globalCompositeOperation = 'source-over'; k0.filter = 'none';
  k0.fillStyle = '#000'; k0.fillRect(0, 0, CW, CH); k0.setTransform(1 / Q, 0, 0, 1 / Q, 0, 0);   // tinta a resolución completa, mismas coordenadas k0.globalCompositeOperation = 'lighter'; k0.lineCap = 'round';
  const s = S * 0.62, rot = -0.12;

  // 1 · la sombra que baja
  if (age < 0 && age > -1.2) {
    const k = sm(-1.2, 0, age);
    c.filter = `blur(${S * (0.08 - 0.06 * k)}px)`;
    c.save(); c.translate(cx, cy); c.rotate(rot); c.scale(1 + (1 - k) * 0.6, 1 + (1 - k) * 0.6);
    c.fillStyle = HI(0.03 * k); solePath(c, s); c.fill(); c.restore();
  }

  if (age >= 0) {
    const fade = 1 - sm(7.6, 9.6, age);

    // 2 · la huella negra con halo térmico, que se apaga de a poco
    const mark = Math.exp(-age * 0.9);
    c.save(); c.translate(cx, cy); c.rotate(rot);
    c.filter = `blur(${S * 0.05}px)`;
    c.fillStyle = HI((0.05 + 0.15 * mark) * fade * (1 - 0.8 * sm(2.2, 3.2, age))); solePath(c, s * 1.08); c.fill();
    c.restore();
    ictx.save(); ictx.translate(cx, cy); ictx.rotate(rot); ictx.filter = `blur(${S * 0.004}px)`;
    ictx.fillStyle = INK((0.3 + 0.7 * mark) * (1 - sm(2.2, 3.2, age))); solePath(ictx, s); ictx.fill(); ictx.restore();

    // 3 · onda expansiva: rayos negros de velocidad
    if (age < 1.2) {
      const k = 1 - age / 1.2;
      c.filter = `blur(${S * 0.006}px)`;
      for (let i = 0; i < 24; i++) {
        const a = (i / 24) * TAU + rnd(i) * 0.12;
        const r0 = S * (0.32 + age * 0.8), r1 = r0 + S * (0.05 + rnd(i + 7) * 0.12) * k;
        ictx.filter = 'none'; ictx.strokeStyle = INK(0.8 * k); ictx.lineWidth = S * (0.004 + rnd(i + 3) * 0.008);
        ictx.beginPath(); ictx.moveTo(cx + Math.cos(a) * r0, cy + Math.sin(a) * r0 * 0.85); ictx.lineTo(cx + Math.cos(a) * r1, cy + Math.sin(a) * r1 * 0.85); ictx.stroke();
      }
    }
    // anillos de choque (calor + tinta fina)
    for (let j = 0; j < 4; j++) {
      const lj = age - j * 0.22;
      if (lj <= 0 || lj > 2.6) continue;
      const r = S * (0.25 + lj * 0.75), k = Math.exp(-lj * 1.1) * fade;
      c.filter = `blur(${S * 0.02}px)`;
      c.strokeStyle = HI(0.16 * k); c.lineWidth = S * (0.05 + lj * 0.02);
      c.beginPath(); c.ellipse(cx, cy, r * 1.25, r, 0, 0, TAU); c.stroke();
      ictx.filter = 'none'; ictx.strokeStyle = INK(0.7 * k); ictx.lineWidth = S * 0.004;
      ictx.beginPath(); ictx.ellipse(cx, cy, r * 1.25 + S * 0.03, r + S * 0.03, 0, 0, TAU); ictx.stroke();
    }

    // letras negras disparadas radialmente, girando, con halo amarillo
    if (age < 3.2) {
      for (let i = 0; i < 30; i++) {
        const a = (i / 30) * TAU + rnd(i + 30) * 0.3;
        const sp = 0.5 + rnd(i + 50) * 1.1, delay = rnd(i + 70) * 0.25;
        const la = age - delay;
        if (la <= 0) continue;
        const r = S * (0.26 + sp * 0.32 * Math.pow(la, 0.7));
        const x = cx + Math.cos(a) * r * 1.3, y = cy + Math.sin(a) * r;
        const k = (1 - sm(1.4, 2.3, la)) * sm(0, 0.08, la);
        if (k < 0.01) continue;
        const fs = S * (0.05 + rnd(i + 90) * 0.07) * (1 + la * 0.25);
        c.save(); c.translate(x, y); c.rotate(a + Math.PI / 2 + (rnd(i) - 0.5) * 2 + la * (rnd(i + 5) - 0.5) * 3);
        burnText(c, CHARS[i % CHARS.length], 0, 0, `800 ${fs}px "Bricolage Grotesque"`, 0.1 * k, 0.75 * k, S, 0.02);
        c.restore();
      }
    }

    // 4 · lo que cambió: IMPACTO negra con halo térmico y ecos de color desplazados (como "Cambia")
    const wenv = sm(2.6, 3.2, age) * (1 - sm(7.2, 8.4, age));
    if (wenv > 0.01) {
      const fs = S * 0.34, X = W / 2, Y = H * 0.47;
      c.font = `800 ${fs}px "Bricolage Grotesque"`;
      c.textAlign = 'center'; c.textBaseline = 'middle';
      c.filter = `blur(${S * 0.05}px)`;                              // halo amplio
      c.fillStyle = HI(0.07 * wenv); c.fillText('IMPACTO', X, Y);
      for (let e = 2; e >= 1; e--) {                                 // ecos de color, desplazados abajo y a la derecha
        c.filter = `blur(${S * (0.012 + e * 0.004)}px)`;
        c.fillStyle = HI((0.1 - e * 0.025) * wenv);
        c.fillText('IMPACTO', X + e * S * 0.03, Y + e * S * 0.035);
      }
      c.filter = `blur(${S * 0.012}px)`;                             // brillo pegado a la letra
      c.fillStyle = HI(0.12 * wenv); c.fillText('IMPACTO', X, Y);
      // negro en degradado tipo glow: un núcleo difuso más una capa suave que se abre hacia afuera
      ictx.save(); ictx.font = c.font; ictx.textAlign = 'center'; ictx.textBaseline = 'middle';
      ictx.filter = `blur(${S * 0.045}px)`; ictx.fillStyle = INK(0.45 * wenv); ictx.fillText('IMPACTO', X, Y);
      ictx.filter = `blur(${S * 0.018}px)`; ictx.fillStyle = INK(0.75 * wenv); ictx.fillText('IMPACTO', X, Y);
      ictx.restore();
    }

    // bajada y logo (como en Vínculo)
    const benv = sm(3.6, 4.3, age) * (1 - sm(7.0, 8.0, age));
    if (benv > 0.01) {
      // exactamente como "La conexión" en Vínculo: solo térmico
      c.filter = `blur(${S * 0.004}px)`;
      c.font = `600 ${S * 0.065}px "Instrument Sans"`;
      c.textAlign = 'center'; c.textBaseline = 'middle';
      c.fillStyle = HI(0.09 * benv);
      c.fillText('El cambio', W / 2, H * 0.8);
      if (logoPaths) {
        const lw = S * 0.32, sc = lw / logoVB[2];
        c.save(); c.translate(W / 2 - lw / 2, H * 0.865); c.scale(sc, sc);
        c.fillStyle = HI(0.08 * benv); logoPaths.forEach((p) => c.fill(p));
        c.restore();
      }
    }
  }
  c.filter = 'none';
}

/* ---------- dibujo ---------- */
function render(t) {
  const age = t - T0;
  shader(sh);
  sh.setUniform('uHeat', heat);
  sh.setUniform('uRamp', rampG);
  sh.setUniform('uInk', inkG);
  sh.setUniform('uRes', [CW, CH]);
  sh.setUniform('uTime', t);
  sh.setUniform('uCell', CH / 90);
  sh.setUniform('uGlitch', Math.min(1, gauss(age, 0.04, 0.12) + 0.6 * gauss(age, 2.7, 0.08) + 0.4 * gauss(age, 7.4, 0.08)));
  sh.setUniform('uFlash', age > -0.05 ? Math.min(1, 0.85 * gauss(age, 0.05, 0.07) + 0.4 * gauss(age, 0.25, 0.04)) : 0);
  sh.setUniform('uRip', age > 0 ? Math.exp(-age * 0.6) * (1 - sm(5, 7, age)) : 0);
  sh.setUniform('uRipT', Math.max(0, age));
  noStroke();
  rect(-width / 2, -height / 2, width, height);
}

function draw() {
  const t = mod(window.T != null ? window.T : millis() / 1000, LOOP);
  if (window.T != null && lastT !== window.T) { for (let i = 45; i >= 1; i--) heatFrame(mod(t - i / 30, LOOP)); }
  heatFrame(t);
  lastT = window.T;
  render(t);
}

/* ---------- exportar MP4 (requiere node server.js) ---------- */
async function exportMP4(name = 'impacto-v2-1920x1080.mp4', fps = 30) {
  const { Muxer, ArrayBufferTarget } = await import('https://cdn.jsdelivr.net/npm/mp4-muxer@5.1.3/+esm');
  const muxer = new Muxer({ target: new ArrayBufferTarget(), video: { codec: 'avc', width: CW, height: CH }, fastStart: 'in-memory' });
  const enc = new VideoEncoder({ output: (c, m) => muxer.addVideoChunk(c, m), error: (e) => console.error(e) });
  enc.configure({ codec: 'avc1.640028', width: CW, height: CH, bitrate: 24e6, framerate: fps });
  const copy = document.createElement('canvas'); copy.width = CW; copy.height = CH;
  const cc = copy.getContext('2d'), gl = drawingContext.canvas, total = LOOP * fps;
  noLoop();
  for (let f = -fps * 2; f < 0; f++) heatFrame(mod(f / fps, LOOP));     // pre-roll: la estela entra en régimen → loop sin salto
  for (let f = 0; f < total; f++) {
    const t = f / fps; heatFrame(t); render(t); cc.drawImage(gl, 0, 0);
    const vf = new VideoFrame(copy, { timestamp: Math.round((f * 1e6) / fps), duration: Math.round(1e6 / fps) });
    enc.encode(vf, { keyFrame: f % fps === 0 }); vf.close();
    if (enc.encodeQueueSize > 6) await new Promise((r) => setTimeout(r, 0));
  }
  await enc.flush(); muxer.finalize();
  await fetch('/export?name=' + encodeURIComponent(name), { method: 'POST', body: new Blob([muxer.target.buffer], { type: 'video/mp4' }) });
  loop();
  return name;
}
</script>
</body>
</html>
