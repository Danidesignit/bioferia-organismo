<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bioferia · Sumar para conectar</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&display=swap">
  <style>
    html, body { margin: 0; height: 100%; background: #2b2b2b; overflow: hidden; }
    main { height: 100%; display: grid; place-items: center; }
    main canvas { max-width: 100vw; max-height: 100vh; width: auto !important; height: auto !important; }
  </style>
</head>
<body>
<main id="stage"></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
<script>
/* =========================================================================
   TAGLINE · "Sumar para conectar"  (prototipo liviano)
   Tres trazos (Pulso W · Vínculo S · Impacto espiral) se acercan; su calor
   se suma y SOLO donde se suma aparece la frase. Después se separan y el
   loop vuelve al inicio sin corte.
   Render: calor en un buffer 2D → shader que lo convierte en relieve
   iluminado con la paleta de los afiches, sobre blanco.
   URL: ?f=v (1080x1920) · ?f=s (1080x1080) · ?f=h (1920x1080)
   ========================================================================= */
const LOOP = 12;                                   // segundos
const FORMATS = { v: [1080, 1920], s: [1080, 1080], h: [1920, 1080] };
const [CW, CH] = FORMATS[new URLSearchParams(location.search).get('f') || 'v'] || FORMATS.v;
const Q = 0.5;                                     // resolución del buffer de calor

// paleta de los afiches de C.G. (calor 0 → 1)
const RAMP = [
  [0.00, '#f4f3ef'], [0.10, '#cfe9d6'], [0.20, '#1f9a5a'], [0.32, '#123a8c'],
  [0.46, '#2d2fb8'], [0.60, '#7a54d6'], [0.74, '#e7a3e6'], [0.88, '#f3d7f4'], [1.00, '#dff6ff'],
];

const VERT = `
precision highp float;
attribute vec3 aPosition; attribute vec2 aTexCoord;
uniform mat4 uModelViewMatrix, uProjectionMatrix;
varying vec2 vUv;
void main(){ vUv = aTexCoord; gl_Position = uProjectionMatrix * uModelViewMatrix * vec4(aPosition, 1.0); }`;

const FRAG = `
precision highp float;
varying vec2 vUv;
uniform sampler2D uHeat, uRamp;
uniform vec2 uTexel;
uniform float uTime, uLight;
float hash(vec2 p){ p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
float H(vec2 uv){ return texture2D(uHeat, uv).r; }
void main(){
  vec2 uv = vUv;
  float h = H(uv);
  // relieve: normal a partir de la pendiente del calor
  float dx = H(uv + vec2(uTexel.x, 0.0)) - H(uv - vec2(uTexel.x, 0.0));
  float dy = H(uv + vec2(0.0, uTexel.y)) - H(uv - vec2(0.0, uTexel.y));
  vec3 n = normalize(vec3(-dx * 9.0, -dy * 9.0, 1.0));
  vec3 L = normalize(vec3(cos(uLight) * 0.6, -0.55 + sin(uLight) * 0.2, 0.75));
  float diff = clamp(dot(n, L), 0.0, 1.0);
  float spec = pow(clamp(dot(reflect(-L, n), vec3(0.0, 0.0, 1.0)), 0.0, 1.0), 22.0);
  float g = hash(gl_FragCoord.xy + fract(uTime) * 91.0) - 0.5;
  float tm = 1.0 - exp(-h * 2.0);          // compresión: las sumas no se saturan
  float t = clamp(tm + g * 0.05, 0.0, 1.0);
  vec3 col = texture2D(uRamp, vec2(t, 0.5)).rgb;
  float body = smoothstep(0.05, 0.22, h);
  col *= mix(1.0, 0.72 + 0.42 * diff, body);
  col += spec * 0.45 * body;
  col += g * 0.035;                       // grano
  gl_FragColor = vec4(col, 1.0);
}`;

let sh, heat, hctx, rampG, font = 'Bricolage Grotesque';

function setup() {
  pixelDensity(1);
  createCanvas(CW, CH, WEBGL).parent('stage');
  sh = createShader(VERT, FRAG);
  heat = createGraphics(Math.round(CW * Q), Math.round(CH * Q)); heat.pixelDensity(1);
  hctx = heat.drawingContext;
  rampG = createGraphics(256, 1); rampG.pixelDensity(1);
  const rc = rampG.drawingContext, gr = rc.createLinearGradient(0, 0, 256, 0);
  RAMP.forEach(([p, c]) => gr.addColorStop(p, c));
  rc.fillStyle = gr; rc.fillRect(0, 0, 256, 1);
  document.fonts.load(`800 100px "${font}"`);
}

/* ---------- formas de cada subsistema (coordenadas en unidades de M) ---------- */
const PATHS = {
  // PULSO: W rítmica
  pulso: (k) => Array.from({ length: 60 }, (_, i) => {
    const u = i / 59;
    return [(u - 0.5) * 0.62, Math.sin(u * Math.PI * 4.5 + k) * 0.11 * (0.7 + 0.3 * Math.sin(u * 9 + k * 2))];
  }),
  // VÍNCULO: S que se entrelaza
  vinculo: (k) => Array.from({ length: 60 }, (_, i) => {
    const u = i / 59, a = (u - 0.5) * Math.PI * 1.9;
    return [Math.sin(a) * 0.17 + Math.sin(u * 7 + k) * 0.012, (u - 0.5) * 0.48];
  }),
  // IMPACTO: espiral que se expande
  impacto: (k) => Array.from({ length: 70 }, (_, i) => {
    const u = i / 69, a = u * Math.PI * 3.4 + k * 0.6, r = 0.03 + u * 0.19;
    return [Math.cos(a) * r, Math.sin(a) * r * 0.9];
  }),
};

const ease = (x) => x * x * (3 - 2 * x);

function draw() {
  const t = ((window.T != null ? window.T : millis() / 1000) % LOOP + LOOP) % LOOP, p = t / LOOP;   // window.T fija un instante (exportar / revisar)
  // 0 → 1 → 0 a lo largo del loop: acercarse, conectar, soltarse
  const gather = ease(0.5 - 0.5 * Math.cos(p * Math.PI * 2));
  const reveal = ease(Math.min(1, Math.max(0, (gather - 0.62) / 0.3)));
  const ph = p * Math.PI * 2;                      // fase cíclica (loop exacto)

  const W = heat.width, Hh = heat.height, M = Math.min(W, Hh), cx = W / 2, cy = Hh / 2;
  const vertical = Hh > W * 1.2, horizontal = W > Hh * 1.2;
  hctx.setTransform(1, 0, 0, 1, 0, 0);
  hctx.globalCompositeOperation = 'source-over';
  hctx.filter = 'none';
  hctx.fillStyle = '#000'; hctx.fillRect(0, 0, W, Hh);
  hctx.globalCompositeOperation = 'lighter';

  // posiciones de partida (separados) → centro (juntos), con margen de seguridad
  const spread = vertical ? [[0, -0.62], [-0.18, 0.05], [0.12, 0.66]]
               : horizontal ? [[-0.62, -0.05], [0, 0.12], [0.62, -0.08]]
               : [[-0.28, -0.3], [0.3, -0.18], [-0.05, 0.33]];
  // juntos: cada trazo queda detrás de una línea de la frase (la sostienen entre los tres)
  const meet = vertical ? [[0.02, -0.17], [-0.03, 0.0], [0.02, 0.17]]
             : horizontal ? [[-0.3, 0.0], [0.0, 0.02], [0.3, 0.0]]
             : [[0.0, -0.16], [-0.02, 0.0], [0.02, 0.16]];
  const keys = ['pulso', 'vinculo', 'impacto'];
  keys.forEach((key, i) => {
    const s = spread[i];
    // juntos: los tres se apilan alrededor del centro, detrás de la frase
    const ox = cx + M * U(s[0], meet[i][0], gather);
    const oy = cy + M * U(s[1], meet[i][1], gather);
    const rot = Math.sin(ph + i * 2) * 0.12 + i * 0.4 * (1 - gather);
    const beat = 1 + 0.06 * Math.sin(ph * (3 + i) + i);   // cada uno con su ritmo
    stroke3(PATHS[key](ph + i), ox, oy, M * 0.95 * beat, rot * (1 - 0.6 * gather), (0.36 + 0.06 * Math.sin(ph * 2 + i)) * (1 - 0.3 * gather));
  });

  // la frase: solo existe donde el calor se suma (aparece con la conexión)
  if (reveal > 0.001) {
    const fs = M * (horizontal ? 0.12 : 0.16);
    hctx.filter = `blur(${(1 - reveal) * M * 0.03 + M * 0.004}px)`;
    hctx.fillStyle = `rgb(${Math.round(120 * reveal)},0,0)`;
    hctx.font = `800 ${fs}px "${font}"`;
    hctx.textAlign = 'center'; hctx.textBaseline = 'middle';
    const lines = horizontal ? ['sumar para conectar'] : ['sumar', 'para', 'conectar'];
    const lh = fs * 0.95;
    lines.forEach((l, i) => hctx.fillText(l, cx, cy + (i - (lines.length - 1) / 2) * lh));
    hctx.filter = 'none';
  }

  shader(sh);
  sh.setUniform('uHeat', heat);
  sh.setUniform('uRamp', rampG);
  sh.setUniform('uTexel', [1 / W, 1 / Hh]);
  sh.setUniform('uTime', t);
  sh.setUniform('uLight', ph);                     // la luz gira y vuelve: sensación de volumen
  noStroke();
  rect(-width / 2, -height / 2, width, height);
}

// interpolación con un pequeño desvío para que no lleguen en línea recta
function U(a, b, k) { return a + (b - a) * k; }

// trazo grueso y difuso: varias pasadas desenfocadas = tubo térmico
function stroke3(pts, ox, oy, sc, rot, heatK) {
  const c = Math.cos(rot), s = Math.sin(rot);
  const M = Math.min(heat.width, heat.height);
  const passes = [[0.2, 0.07, 0.35], [0.13, 0.04, 0.45], [0.075, 0.02, 0.5]]; // [ancho, blur, calor]
  for (const [w, b, k] of passes) {
    hctx.filter = `blur(${M * b}px)`;
    hctx.strokeStyle = `rgb(${Math.round(255 * heatK * k)},0,0)`;
    hctx.lineWidth = M * w;
    hctx.lineCap = 'round'; hctx.lineJoin = 'round';
    hctx.beginPath();
    pts.forEach(([x, y], i) => {
      const px = ox + (x * c - y * s) * sc, py = oy + (x * s + y * c) * sc;
      i ? hctx.lineTo(px, py) : hctx.moveTo(px, py);
    });
    hctx.stroke();
  }
  hctx.filter = 'none';
}
</script>
</body>
</html>
