<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bioferia · Misceláneas</title>
  <style>
    body { margin: 0; padding: 40px; background: #F4F3EE; font: 14px/1.4 system-ui, sans-serif; color: #1A1033; }
    h2 { margin: 40px 0 16px; font-size: 16px; }
    .grid { display: flex; flex-wrap: wrap; gap: 28px; align-items: center; }
    figure { margin: 0; display: grid; gap: 8px; justify-items: start; }
    figure canvas { background: repeating-conic-gradient(#ebe9e1 0 25%, #f4f3ee 0 50%) 0 0 / 16px 16px; max-height: 120px; max-width: 700px; width: auto; height: auto; object-fit: contain; }
    figcaption { font-size: 12px; opacity: .6; }
  </style>
</head>
<body>
<h1>Misceláneas · violeta oscuro, volumen de globo</h1>
<p>PNG transparentes. <code>exportAll()</code> en la consola las guarda en exports/ (con node server.js).</p>
<h2>Puntos · lo individual</h2><div class="grid" id="dots"></div>
<h2>Líneas · lo que conecta</h2><div class="grid" id="lines"></div>
<script>
/* =========================================================================
   Misceláneas editoriales: piezas chicas para ordenar contenido.
   Un solo color (violeta oscuro de la marca) con volumen de globo:
   luz arriba a la izquierda, sombra abajo, brillo especular suave.
   ========================================================================= */
const C = {
  deep: '#1d0b45',     // sombra
  base: '#32167c',     // violeta oscuro (cuerpo)
  mid: '#4823a6',
  light: '#7a45d6',    // luz
  glow: '#c9b2ff',
};
const TAU = Math.PI * 2;

// esfera inflada
function sphere(c, x, y, r) {
  const g = c.createRadialGradient(x - r * 0.35, y - r * 0.4, r * 0.05, x, y, r);
  g.addColorStop(0, C.light); g.addColorStop(0.45, C.mid); g.addColorStop(0.85, C.base); g.addColorStop(1, C.deep);
  c.fillStyle = g; c.beginPath(); c.arc(x, y, r, 0, TAU); c.fill();
  // rebote de luz abajo
  const b = c.createRadialGradient(x + r * 0.25, y + r * 0.55, 0, x + r * 0.25, y + r * 0.55, r * 0.5);
  b.addColorStop(0, 'rgba(138,78,232,0.35)'); b.addColorStop(1, 'rgba(138,78,232,0)');
  c.fillStyle = b; c.beginPath(); c.arc(x, y, r, 0, TAU); c.fill();
  // brillo
  const s = c.createRadialGradient(x - r * 0.38, y - r * 0.45, 0, x - r * 0.38, y - r * 0.45, r * 0.38);
  s.addColorStop(0, 'rgba(255,255,255,0.85)'); s.addColorStop(0.4, 'rgba(230,215,255,0.35)'); s.addColorStop(1, 'rgba(255,255,255,0)');
  c.fillStyle = s; c.beginPath(); c.arc(x, y, r, 0, TAU); c.fill();
}

// tubo inflado a lo largo de un trazo (path = función que dibuja el recorrido)
function tube(c, path, w) {
  c.lineCap = 'round'; c.lineJoin = 'round';
  const pass = (width, color, dx, dy, blur = 0, alpha = 1) => {
    c.save(); c.globalAlpha = alpha; c.filter = blur ? `blur(${blur}px)` : 'none';
    c.translate(dx, dy); c.strokeStyle = color; c.lineWidth = width; c.beginPath(); path(c); c.stroke(); c.restore();
  };
  pass(w, C.deep, 0, 0);
  pass(w * 0.86, C.base, -w * 0.03, -w * 0.05, w * 0.06);
  pass(w * 0.6, C.mid, -w * 0.06, -w * 0.1, w * 0.1);
  pass(w * 0.32, C.light, -w * 0.08, -w * 0.15, w * 0.1);
  pass(w * 0.12, 'rgba(255,255,255,0.8)', -w * 0.08, -w * 0.2, w * 0.05, 0.85);
}

function anillo(c, x, y, r, w) { tube(c, (k) => k.arc(x, y, r, 0, TAU), w); }

/* ---------- piezas ---------- */
const PIECES = [
  // puntos
  { group: 'dots', name: 'punto', w: 400, h: 400, draw: (c) => sphere(c, 200, 200, 150) },
  { group: 'dots', name: 'punto-chico', w: 200, h: 200, draw: (c) => sphere(c, 100, 100, 70) },
  { group: 'dots', name: 'punto-anillo', w: 480, h: 480, draw: (c) => { anillo(c, 240, 240, 190, 26); sphere(c, 240, 240, 105); } },
  { group: 'dots', name: 'tres-puntos', w: 900, h: 300, draw: (c) => { sphere(c, 150, 150, 110); sphere(c, 450, 150, 80); sphere(c, 700, 150, 52); } },
  { group: 'dots', name: 'tres-puntos-vertical', w: 260, h: 760, draw: (c) => { sphere(c, 130, 130, 100); sphere(c, 130, 390, 72); sphere(c, 130, 610, 48); } },
  { group: 'dots', name: 'capsula', w: 560, h: 260, draw: (c) => tube(c, (k) => { k.moveTo(140, 130); k.lineTo(420, 130); }, 200) },
  // líneas
  { group: 'lines', name: 'filete', w: 2000, h: 120, draw: (c) => tube(c, (k) => { k.moveTo(50, 60); k.lineTo(1950, 60); }, 42) },
  { group: 'lines', name: 'filete-fino', w: 2000, h: 80, draw: (c) => tube(c, (k) => { k.moveTo(30, 40); k.lineTo(1970, 40); }, 22) },
  { group: 'lines', name: 'filete-con-punto', w: 2000, h: 200, draw: (c) => { tube(c, (k) => { k.moveTo(170, 100); k.lineTo(1950, 100); }, 34); sphere(c, 100, 100, 80); } },
  { group: 'lines', name: 'punto-linea-punto', w: 2000, h: 200, draw: (c) => { tube(c, (k) => { k.moveTo(140, 100); k.lineTo(1860, 100); }, 30); sphere(c, 100, 100, 72); sphere(c, 1900, 100, 72); } },
  { group: 'lines', name: 'cuentas', w: 2000, h: 180, draw: (c) => {
      tube(c, (k) => { k.moveTo(90, 90); k.lineTo(1910, 90); }, 16);
      for (let i = 0; i < 9; i++) { const x = 90 + i * (1820 / 8); sphere(c, x, 90, i % 4 === 0 ? 62 : 40); }
    } },
  { group: 'lines', name: 'onda', w: 2000, h: 280, draw: (c) => tube(c, (k) => {
      for (let i = 0; i <= 200; i++) { const x = 60 + (i / 200) * 1880, y = 140 + Math.sin((i / 200) * TAU * 2.5) * 70 * Math.sin((i / 200) * Math.PI);
        i ? k.lineTo(x, y) : k.moveTo(x, y); }
    }, 34) },
  { group: 'lines', name: 'pulso', w: 2000, h: 360, draw: (c) => tube(c, (k) => {
      const g = (u, m, s) => Math.exp(-(((u - m) / s) ** 2));
      for (let i = 0; i <= 400; i++) { const u = i / 400, x = 60 + u * 1880;
        const y = 220 - 150 * g(u, 0.5, 0.012) + 60 * g(u, 0.53, 0.012) - 30 * g(u, 0.62, 0.035);
        i ? k.lineTo(x, y) : k.moveTo(x, y); }
    }, 30) },
  { group: 'lines', name: 'doble-filete', w: 2000, h: 160, draw: (c) => {
      tube(c, (k) => { k.moveTo(40, 50); k.lineTo(1960, 50); }, 30);
      tube(c, (k) => { k.moveTo(40, 112); k.lineTo(1960, 112); }, 14);
    } },
  { group: 'lines', name: 'esquina', w: 700, h: 700, draw: (c) => { tube(c, (k) => { k.moveTo(90, 610); k.lineTo(90, 90); k.lineTo(610, 90); }, 34); sphere(c, 90, 90, 62); } },
];

const canvases = {};
for (const p of PIECES) {
  const cv = document.createElement('canvas'); cv.width = p.w; cv.height = p.h;
  p.draw(cv.getContext('2d'));
  canvases[p.name] = cv;
  const fig = document.createElement('figure'), cap = document.createElement('figcaption');
  cap.textContent = p.name + '.png';
  fig.append(cv, cap);
  document.getElementById(p.group).appendChild(fig);
}

async function exportAll() {
  for (const p of PIECES) {
    const blob = await new Promise((r) => canvases[p.name].toBlob(r, 'image/png'));
    await fetch('/export?name=' + encodeURIComponent('miscelanea-' + p.name + '.png'), { method: 'POST', body: blob });
  }
  return PIECES.length;
}
</script>
</body>
</html>
